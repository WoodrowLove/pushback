<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- App icon. Source SVG; PNG variants generated for iOS / Android home-screen install.
       Visual: a paper bill with a return-to-sender arrow over it — "push back". -->
  <rect width="512" height="512" rx="96" fill="#fbfbfa"/>
  <rect x="120" y="96" width="272" height="320" rx="12" fill="#fff" stroke="#0f1922" stroke-width="8"/>
  <line x1="160" y1="160" x2="352" y2="160" stroke="#0f1922" stroke-width="6" stroke-linecap="round"/>
  <line x1="160" y1="200" x2="312" y2="200" stroke="#5a6577" stroke-width="6" stroke-linecap="round"/>
  <line x1="160" y1="232" x2="280" y2="232" stroke="#5a6577" stroke-width="6" stroke-linecap="round"/>
  <line x1="160" y1="264" x2="328" y2="264" stroke="#5a6577" stroke-width="6" stroke-linecap="round"/>
  <line x1="160" y1="296" x2="272" y2="296" stroke="#5a6577" stroke-width="6" stroke-linecap="round"/>
  <!-- Pushback arrow: bold orange arrow pointing left, layered over the bill -->
  <g transform="translate(0,30)">
    <path d="M 380 350 L 200 350 M 240 310 L 200 350 L 240 390"
          fill="none" stroke="#d65a31" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
